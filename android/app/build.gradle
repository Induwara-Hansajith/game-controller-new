plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketcontroller'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pocketcontroller'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.1.0-beta.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
